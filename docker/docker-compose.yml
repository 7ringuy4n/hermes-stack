# assistant — core stack. Plain container names (hermes, valkey, â€¦).
# Optional workers: compose profiles + WORKER_*=active (schedule, zalo, omnirouter, â€¦).
# Media overlay: docker-compose.media.yml. Security/notify overlay: docker-compose.security.yml.
name: assistant

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  valkey_data:
  qdrant_data:
  nine_router_data:
  omni_router_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MEMORY_DB_USER:-hermes}
      POSTGRES_PASSWORD: ${MEMORY_DB_PASSWORD:?set MEMORY_DB_PASSWORD in .env}
      POSTGRES_DB: ${MEMORY_DB_NAME:-hermes_memory}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Relative to --project-directory (repo root), not compose file dir
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MEMORY_DB_USER:-hermes}"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    container_name: valkey
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "valkey-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [internal]
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"

  memory:
    build: ./architect/memory/memory-manager
    container_name: memory
    restart: unless-stopped
    environment:
      - VALKEY_URL=${VALKEY_URL:-redis://valkey:6379/0}
      - REDIS_URL=${VALKEY_URL:-${REDIS_URL:-redis://valkey:6379/0}}
      - DATABASE_URL=postgresql://${MEMORY_DB_USER:-hermes}:${MEMORY_DB_PASSWORD}@postgres:5432/${MEMORY_DB_NAME:-hermes_memory}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION_MEMORY:-conversational_memory}
      - EMBED_URL=${EMBED_URL:-http://embedding:8094}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "127.0.0.1:${MEMORY_PORT:-8095}:8095"
    networks: [internal]

  session:
    build: ./architect/memory/session
    container_name: session
    restart: unless-stopped
    environment:
      - VALKEY_URL=${VALKEY_URL:-redis://valkey:6379/0}
      - REDIS_URL=${VALKEY_URL:-${REDIS_URL:-redis://valkey:6379/0}}
      - SESSION_MAX_MESSAGES=${SESSION_MAX_MESSAGES:-16}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    depends_on:
      valkey:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SESSION_PORT:-8107}:8107"
    networks: [internal]

  workflow:
    build: ./architect/workflow
    container_name: workflow
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${MEMORY_DB_USER:-hermes}:${MEMORY_DB_PASSWORD}@postgres:5432/${MEMORY_DB_NAME:-hermes_memory}
      - VALKEY_URL=${VALKEY_URL:-redis://valkey:6379/0}
      - HERMES_API_URL=${HERMES_API_URL:-http://hermes:8642/v1/chat/completions}
      - HERMES_API_KEY=${API_SERVER_KEY:-}
      - HERMES_WORKFLOW_TIMEOUT_S=${HERMES_WORKFLOW_TIMEOUT_S:-90}
      - MODEL_ROUTER_URL=${MODEL_ROUTER_URL:-http://model-router:8096}
      - SCHEDULE_URL=${SCHEDULE_URL:-http://schedule-worker:8110}
      - SCHEDULE_WORKER=${SCHEDULE_WORKER:-1}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WORKFLOW_PORT:-8108}:8108"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8108/health', timeout=3)",
        ]
      interval: 5s
      timeout: 4s
      retries: 12
    networks: [internal]

  schedule-worker:
    profiles: ["schedule"]
    build: ./architect/schedule-worker
    restart: unless-stopped
    environment:
      # Postgres is SoT when DATABASE_URL is set (default). SQLITE_PATH is not used.
      # Local/migrate fallback without DSN still defaults to /data/schedules.db in code.
      - DATABASE_URL=postgresql://${MEMORY_DB_USER:-hermes}:${MEMORY_DB_PASSWORD}@postgres:5432/${MEMORY_DB_NAME:-hermes_memory}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - ZALO_INJECT_URL=${ZALO_INJECT_URL:-http://zalo-proxy:8787/inject-event}
      - ZALO_PLUGIN_TOKEN=${ZALO_PLUGIN_TOKEN:-}
      - HERMES_FIRE_URL=${HERMES_API_URL:-http://hermes:8642/v1/chat/completions}
      - HERMES_API_KEY=${API_SERVER_KEY:-}
      - TICK_MS=${SCHEDULE_TICK_MS:-2000}
      - GRACE_S=${SCHEDULE_GRACE_S:-120}
    volumes:
      - ${ASSISTANT_DATA_DIR:-/data/assistant}/schedule:/data
    ports:
      - "127.0.0.1:${SCHEDULE_PORT:-8110}:8110"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:8110/health",
        ]
      interval: 5s
      timeout: 4s
      retries: 12
    networks: [internal]

  embedding:
    build: ./architect/tools/embedding
    container_name: embedding
    restart: unless-stopped
    environment:
      - EMBED_UPSTREAM=${EMBED_UPSTREAM:-http://omni-router:20129/v1}
      - EMBED_API_KEY=${EMBED_API_KEY:-${OMNIROUTER_API_KEY:-${N9ROUTER_API_KEY:-}}}
      - OPENAI_API_KEY=${OMNIROUTER_API_KEY:-${N9ROUTER_API_KEY:-}}
      - EMBED_MODEL=${EMBED_MODEL:-embedding}
      - EMBED_BACKEND=${EMBED_BACKEND:-auto}
      - EMBED_LOCAL_FALLBACK=${EMBED_LOCAL_FALLBACK:-1}
      - EMBED_LOCAL_MODEL=${EMBED_LOCAL_MODEL:-BAAI/bge-small-en-v1.5}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "127.0.0.1:${EMBED_PORT:-8094}:8094"
    networks: [internal]

  ingest:
    build: ./architect/tools/ingest
    container_name: ingest
    restart: unless-stopped
    environment:
      - VALKEY_URL=${VALKEY_URL:-redis://valkey:6379/0}
      - REDIS_URL=${VALKEY_URL:-${REDIS_URL:-redis://valkey:6379/0}}
      - OCR_URL=${OCR_URL:-http://ocr:8091}
      - EMBED_URL=${EMBED_URL:-http://embedding:8094}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - NOTIFY_URL=${NOTIFY_URL:-http://notify:8092}
      - ZALO_BRIDGE_URL=${ZALO_BRIDGE_URL:-http://zalo-proxy:8787}
      - ZALO_PLUGIN_TOKEN=${ZALO_PLUGIN_TOKEN:-}
      - ZALO_ADMIN_USERS=${ZALO_ADMIN_USERS:-}
      - ZALO_ADMIN_USERS_FILE=/data/assistant/zalo_admin_users.txt
      - NOTIFY_ZALO_THREAD=${NOTIFY_ZALO_THREAD:-}
      - NOTIFY_ZALO_THREAD_TYPE=${NOTIFY_ZALO_THREAD_TYPE:-user}
      - INGEST_MEDIA_ROOT=/data/media
      - LEARN_DOCS_ROOT=${LEARN_DOCS_ROOT:-/data/assistant/docs}
      - LEARN_LIST_LIMIT=${LEARN_LIST_LIMIT:-5}
      - LEARN_REQUIRE_APPROVE=${LEARN_REQUIRE_APPROVE:-0}
      - LEARN_NOTIFY_PATH=/app/learn-notify.json
      - SECRET_PROBE_POLICY=/opt/data/secret-probe.json
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ${ASSISTANT_DATA_DIR:-/data/assistant}/media:/data/media
      - ${ASSISTANT_DATA_DIR:-/data/assistant}:/data/assistant
      - ./hermes/main/messages/learn-notify.json:/app/learn-notify.json:ro
      - ./config/agent/secret-probe.json:/opt/data/secret-probe.json:ro
    depends_on:
      - valkey
      - embedding
      - qdrant
    ports:
      - "127.0.0.1:${INGEST_PORT:-8099}:8099"
    networks: [internal]

  dispatcher:
    profiles: ["media"]
    build:
      context: ./architect/models/dispatcher
      args:
        # ASR wheels are only baked in when the stack runs with WHISPER_ENABLED=1.
        INSTALL_WHISPER: ${WHISPER_ENABLED:-0}
    restart: unless-stopped
    environment:
      # Web search lives on router-worker (/v1/search) — media worker only links to it
      - WEB_SEARCH_URL=${MODEL_ROUTER_URL:-http://model-router:8096}
      - OCR_URL=${OCR_URL:-http://ocr:8091}
      - MEDIA_TEXT_FRAMES=${MEDIA_TEXT_FRAMES:-4}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://omni-router:20129/v1}
      - OPENAI_API_KEY=${OMNIROUTER_API_KEY:-${N9ROUTER_API_KEY:-}}
      - WHISPER_ENABLED=${WHISPER_ENABLED:-0}
      - WHISPER_MODEL=${WHISPER_MODEL:-tiny}
      # Keep the downloaded ASR model on the media volume instead of re-fetching per recreate.
      - HF_HOME=${WHISPER_CACHE_DIR:-/data/media/.cache/huggingface}
      - OFFICE_FILE_GEN=${OFFICE_FILE_GEN:-1}
      - ENABLE_MEDIA_FILE=${ENABLE_MEDIA_FILE:-inactive}
      - MEDIA_CACHE_DIR=/data/media
      # Image diffusion via router combo IMAGE_GEN_COMBO (default image-gen when media active, hermes when inactive).
      - IMAGE_GEN_COMBO=${IMAGE_GEN_COMBO:-image-gen}
      - OMNIROUTER_BASE_URL=${OMNIROUTER_BASE_URL:-http://omni-router:20129/v1}
      - OMNIROUTER_API_KEY=${OMNIROUTER_API_KEY:-}
      - ENABLE_OMNIROUTER=${ENABLE_OMNIROUTER:-1}
      - ENABLE_9ROUTER=${ENABLE_9ROUTER:-0}
      - N9ROUTER_BASE_URL=${N9ROUTER_BASE_URL:-http://9router:20128/v1}
      - N9ROUTER_API_KEY=${N9ROUTER_API_KEY:-}
      - IMAGE_REFINE=${IMAGE_REFINE:-0}
      - IMAGE_ALLOW_PILLOW=${IMAGE_ALLOW_PILLOW:-0}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      # Zalo outbound (send-file / send_zalo on /v1/image) via host bridge proxy
      - ZALO_BRIDGE_URL=${ZALO_BRIDGE_URL:-http://zalo-proxy:8787}
      - ZALO_PLUGIN_TOKEN=${ZALO_PLUGIN_TOKEN:-}
      - ZALO_HOST_MEDIA_DIR=${ASSISTANT_DATA_DIR:-/data/assistant}/media
      - ZALO_HOST_DATA_DIR=${ASSISTANT_DATA_DIR:-${HERMES_DATA_DIR:-/data/assistant}}
      - AV_SCAN=${AV_SCAN:-0}
    volumes:
      - ${ASSISTANT_DATA_DIR:-/data/assistant}/media:/data/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${DISPATCHER_PORT:-8090}:8090"
    networks: [internal]

  # Low Must: optional LLM gateway (ENABLE_9ROUTER=active). Default path is OmniRouter via router-worker.
  9router:
    profiles: ["9router"]
    image: ${N9ROUTER_IMAGE:-decolua/9router:latest}
    container_name: 9router
    restart: unless-stopped
    environment:
      - DATA_DIR=/app/data
      - PORT=20128
      - HOSTNAME=0.0.0.0
      - REQUIRE_API_KEY=true
      - INITIAL_PASSWORD=${N9ROUTER_INITIAL_PASSWORD:-unused}
    volumes:
      - nine_router_data:/app/data
    ports:
      - "127.0.0.1:${N9ROUTER_HOST_PORT:-20128}:20128"
    networks: [internal]

  # Router Worker — task-aware LLM proxy (coding → 9router, general → OmniRouter)
  router-worker:
    build: ./architect/models/model-router
    container_name: router-worker
    restart: unless-stopped
    environment:
      - N9ROUTER_BASE_URL=${N9ROUTER_BASE_URL:-http://9router:20128/v1}
      - OMNIROUTER_BASE_URL=${OMNIROUTER_BASE_URL:-http://omni-router:20129/v1}
      - ENABLE_OMNIROUTER=${ENABLE_OMNIROUTER:-1}
      - ENABLE_9ROUTER=${ENABLE_9ROUTER:-0}
      - N9ROUTER_API_KEY=${N9ROUTER_API_KEY:-}
      - OMNIROUTER_API_KEY=${OMNIROUTER_API_KEY:-}
      - FALLBACK_OPENAI_BASE_URL=${FALLBACK_OPENAI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - FALLBACK_OPENAI_MODEL=${FALLBACK_OPENAI_MODEL:-gpt-4o-mini}
      - MODEL_ROUTER_TIMEOUT_S=${MODEL_ROUTER_TIMEOUT_S:-180}
      # Chat combo = hermes. Classify combo = classifier (OpenCode oc/* via first-setup).
      - OMNIROUTER_DEFAULT_COMBO=${OMNIROUTER_DEFAULT_COMBO:-hermes}
      - OMNIROUTER_FAILOVER_MODELS=${OMNIROUTER_FAILOVER_MODELS:-auto/best-free}
      - OMNIROUTER_ROTATE_ATTEMPTS=${OMNIROUTER_ROTATE_ATTEMPTS:-5}
      - OMNIROUTER_BUSY_BACKOFF_S=${OMNIROUTER_BUSY_BACKOFF_S:-3}
      - N9ROUTER_DEFAULT_COMBO=${N9ROUTER_DEFAULT_COMBO:-hermes}
      - OMNIROUTER_CLASSIFY_COMBO=${OMNIROUTER_CLASSIFY_COMBO:-classifier}
      - MODEL_ROUTER_CLASSIFY_MODEL=${MODEL_ROUTER_CLASSIFY_MODEL:-${OMNIROUTER_CLASSIFY_COMBO:-classifier}}
      - MODEL_ROUTER_OUTBOUND_MODEL=${MODEL_ROUTER_OUTBOUND_MODEL:-${OMNIROUTER_DEFAULT_COMBO:-hermes}}
      - MODEL_ROUTER_CLASSIFY=${MODEL_ROUTER_CLASSIFY:-/opt/data/skills/classify/classify.json}
      - MODEL_ROUTER_OUTBOUND=${MODEL_ROUTER_OUTBOUND:-/opt/data/skills/outbound/outbound.json}
      - WEB_SEARCH_COMBO_PATH=${WEB_SEARCH_COMBO_PATH:-/opt/data/skills/web-search/web-search-combo.json}
      - MODEL_ROUTER_PORT=8096
      # Web search: default omni proxies to Omni UI (Tavily → Firecrawl → SearXNG).
      # Override WEB_BACKENDS=tavily,firecrawl,searxng only when Omni is off.
      - WEB_BACKENDS=${WEB_BACKENDS:-omni}
      - OMNIROUTER_SEARCH_PROVIDERS=${OMNIROUTER_SEARCH_PROVIDERS:-tavily-search,firecrawl-search,searxng-search}
      - WEB_SEARCH_PROVIDER_TIMEOUT_S=${WEB_SEARCH_PROVIDER_TIMEOUT_S:-30}
      - WEB_EXTRACT_BACKENDS=${WEB_EXTRACT_BACKENDS:-tavily,firecrawl}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - EXA_API_KEY=${EXA_API_KEY:-}
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
      - SEARXNG_MAX_RESULTS=${WEB_SEARCH_MAX_RESULTS:-3}
      - WEB_SEARCH_MAX_RESULTS=${WEB_SEARCH_MAX_RESULTS:-3}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      # Classify prompt SoT lives in Hermes skills (single edit surface).
      - ./hermes/main/skills:/opt/data/skills:ro
    ports:
      - "127.0.0.1:${MODEL_ROUTER_HOST_PORT:-8096}:8096"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      internal:
        aliases:
          - model-router

  # Optional OmniRouter — ENABLE_OMNIROUTER=active (compose profile omnirouter)
  # Dedicated image (not 9router). Override with OMNIROUTER_IMAGE in .env.
  omni-router:
    profiles: ["omnirouter"]
    image: ${OMNIROUTER_IMAGE:-diegosouzapw/omniroute:latest}
    container_name: omni-router
    restart: unless-stopped
    environment:
      - DATA_DIR=/app/data
      - PORT=20129
      - HOSTNAME=0.0.0.0
      - REQUIRE_API_KEY=true
      - INITIAL_PASSWORD=${OMNIROUTER_INITIAL_PASSWORD:-${N9ROUTER_INITIAL_PASSWORD:-unused}}
      - ENABLE_MEMORY=${OMNIROUTER_ENABLE_MEMORY:-1}
      - MEMORY_ENABLED=${OMNIROUTER_ENABLE_MEMORY:-1}
      # Stop Omni background provider connection tests (scheduler latency / noise).
      - OMNIROUTE_DISABLE_CREDENTIAL_HEALTH_CHECK=${OMNIROUTE_DISABLE_CREDENTIAL_HEALTH_CHECK:-true}
    volumes:
      - omni_router_data:/app/data
    ports:
      # Default localhost-only. For OpenVPN admin access from any OS client, set
      # OMNIROUTER_BIND=0.0.0.0 and firewall-allow only the VPN subnet (see docs).
      - "${OMNIROUTER_BIND:-127.0.0.1}:${OMNIROUTER_HOST_PORT:-20129}:20129"
    networks: [internal]

  hermes:
    # When ENABLE_OPENBAO=active, first-setup-openbao writes ${ASSISTANT_DATA_DIR}/.env.openbao
    env_file:
      - path: ${ASSISTANT_DATA_DIR:-${HERMES_DATA_DIR:-/data/assistant}}/.env.openbao
        required: false
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    # No container_name — required for HERMES_REPLICAS > 1
    restart: unless-stopped
    pull_policy: missing
    # Per-replica HERMES_HOME under /opt/data/replicas/<hostname> (avoids gateway.lock race).
    # entrypoint chains to image entrypoint-dispatch.sh; default args = gateway run
    # (see hermes-replica-entry.sh — do NOT exec raw /init with these args).
    entrypoint: ["/bin/sh", "/opt/stack/hermes-replica-entry.sh"]
    command: ["gateway", "run"]
    # Host ports: see docker-compose.hermes-hostports.yml when HERMES_REPLICAS=1
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - HERMES_HOME=/opt/data
      - HERMES_SHARED_DATA=/opt/data
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_USER:-admin}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_PASSWORD:?set HERMES_DASHBOARD_PASSWORD in .env}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_SECRET:?set HERMES_DASHBOARD_SECRET in .env}
      # OpenAI-compatible API on :8642 — must bind 0.0.0.0 for Traefik / Docker LB (default is 127.0.0.1).
      - API_SERVER_ENABLED=${API_SERVER_ENABLED:-true}
      - API_SERVER_HOST=${API_SERVER_HOST:-0.0.0.0}
      - API_SERVER_PORT=${API_SERVER_PORT:-8642}
      - API_SERVER_KEY=${API_SERVER_KEY:?set API_SERVER_KEY in .env}
      - HERMES_DISABLE_LAZY_INSTALLS=0
      - HERMES_LAZY_INSTALL_TARGET=/opt/data/lazy-packages
      - PYTHONPATH=/opt/data/lazy-packages
      # OmniRouter is default; 9Router optional. Empty key breaks Hermes→model-router auth on some paths.
      - OPENAI_API_KEY=${OMNIROUTER_API_KEY:-${N9ROUTER_API_KEY:-}}
      # Direct Omni image-gen (/images/generations); chat still goes via model-router.
      - OMNIROUTER_BASE_URL=${OMNIROUTER_BASE_URL:-http://omni-router:20129/v1}
      - OMNIROUTER_API_KEY=${OMNIROUTER_API_KEY:-}
      - IMAGE_GEN_COMBO=${IMAGE_GEN_COMBO:-image-gen}
      # v0.5.0: prefer model-router; set HERMES_OPENAI_BASE_URL to override (e.g. dispatcher)
      - OPENAI_BASE_URL=${HERMES_OPENAI_BASE_URL:-http://model-router:8096/v1}
      - DISPATCHER_URL=http://dispatcher:8090
      - MODEL_ROUTER_URL=${MODEL_ROUTER_URL:-http://model-router:8096}
      - MEMORY_URL=http://memory:8095
      - EMBED_URL=${EMBED_URL:-http://embedding:8094}
      - INGEST_URL=${INGEST_URL:-http://ingest:8099}
      - SESSION_URL=${SESSION_URL:-http://session:8107}
      - HERMES_SESSION_BACKEND=redis
      - VALKEY_URL=${VALKEY_URL:-redis://valkey:6379/0}
      - REDIS_URL=${VALKEY_URL:-${REDIS_URL:-redis://valkey:6379/0}}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_COLLECTION_KNOWLEDGE=${QDRANT_COLLECTION_KNOWLEDGE:-knowledge_chunks}
      - QDRANT_COLLECTION_MEMORY=${QDRANT_COLLECTION_MEMORY:-conversational_memory}
      - HERMES_QUIET_EXCEPTIONS=${HERMES_QUIET_EXCEPTIONS:-1}
      - HERMES_QUIET_BACKGROUND=${HERMES_QUIET_BACKGROUND:-1}
      - LEARN_LIST_LIMIT=${LEARN_LIST_LIMIT:-5}
      - HERMES_MAX_ANSWERING=${HERMES_MAX_ANSWERING:-3}
      - HERMES_MAX_INFLIGHT=${HERMES_MAX_INFLIGHT:-3}
      - HERMES_CONTEXT_BUDGET=${HERMES_CONTEXT_BUDGET:-24000}
      # Media worker URLs (services only up when overlay is loaded)
      - OCR_URL=${OCR_URL:-http://ocr:8091}
      - JOBS_URL=${JOBS_URL:-http://jobs:8104}
      - WORKFLOW_URL=${WORKFLOW_URL:-http://workflow:8108}
      - SCHEDULE_URL=${SCHEDULE_URL:-http://schedule-worker:8110}
      - SCHEDULE_WORKER=${SCHEDULE_WORKER:-1}
      - HERMES_WORKFLOW=${HERMES_WORKFLOW:-1}
      - ZALO_WORKFLOW=${ZALO_WORKFLOW:-1}
      - ZALO_WORKFLOW_TURN_TIMEOUT_S=${ZALO_WORKFLOW_TURN_TIMEOUT_S:-420}
      - ZALO_WORKFLOW_PARALLEL=${ZALO_WORKFLOW_PARALLEL:-8}
      # Native Hermes web_search uses SEARXNG_URL → {base}/search?format=json.
      # Point at Router Worker SearXNG-compat shim (Omni-backed), not the raw
      # SearXNG container (datacenter CAPTCHA / empty results).
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - SEARXNG_URL=${HERMES_SEARXNG_URL:-http://model-router:8096/v1/searxng-compat}
      # Skill/HTTP path: Router Worker → Omni search gateway
      - WEB_SEARCH_URL=${MODEL_ROUTER_URL:-http://model-router:8096}
      - ZALO_ATTACHMENT_CONTEXT_TTL_S=${ZALO_ATTACHMENT_CONTEXT_TTL_S:-86400}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      # Zalo (used when ENABLE_ZALO=active + host bridge + zalo-proxy profile)
      # Only replica hermes-1 keeps ZALO_PLUGIN_URL (see hermes-replica-entry.sh).
      - ZALO_PLUGIN_URL=${ZALO_PLUGIN_URL:-http://host.docker.internal:8787}
      - ZALO_PLUGIN_TOKEN=${ZALO_PLUGIN_TOKEN:-}
      - ZALO_GROUP_MODE=${ZALO_GROUP_MODE:-mention}
      - ZALO_ALLOWED_THREADS=${ZALO_ALLOWED_THREADS:-}
      - ZALO_HOME_CHANNEL=${ZALO_HOME_CHANNEL:-}
      - ZALO_INBOUND_QUEUE=${ZALO_INBOUND_QUEUE:-1}
      - ZALO_INBOUND_QUEUE_MAX=${ZALO_INBOUND_QUEUE_MAX:-16}
      - ZALO_INBOUND_QUEUE_TTL_S=${ZALO_INBOUND_QUEUE_TTL_S:-3600}
      # Hung Hermes/archive turn must not block the next Zalo message forever (15m floor).
      - ZALO_QUEUE_TURN_TIMEOUT_S=${ZALO_QUEUE_TURN_TIMEOUT_S:-900}
      - ZALO_QUEUE_DRAIN_MAX_S=${ZALO_QUEUE_DRAIN_MAX_S:-1200}
      - ZALO_ADMIN_USERS=${ZALO_ADMIN_USERS:-}
      - ZALO_ADMIN_USERS_FILE=/opt/data/zalo_admin_users.txt
      - ZALO_HOST_DATA_DIR=${ASSISTANT_DATA_DIR:-${HERMES_DATA_DIR:-/data/assistant}}
      - ZALO_ALLOWED_THREADS_FILE=/opt/data/zalo_allowed_threads.txt
      - ZALO_DENIED_THREADS_FILE=/opt/data/zalo_denied_threads.txt
      - ZALO_ALLOWED_USERS_FILE=/opt/data/zalo_allowed_users.txt
      - ZALO_USERS_MODE_FILE=/opt/data/zalo_users_mode.txt
      - ZALO_API_URL=${ZALO_API_URL:-http://zalo-api:8100}
      - ZALO_API_TOKEN=${ZALO_API_TOKEN:-}
      - ADMIN_API_URL=${ADMIN_API_URL:-http://zalo-api:8100}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-}
      - GATEWAY_ALLOW_ALL_USERS=${GATEWAY_ALLOW_ALL_USERS:-true}
      - HERMES_REPLICAS=${HERMES_REPLICAS:-1}
      - SECRET_PROBE_POLICY=/opt/data/secret-probe.json
    volumes:
      - ${HERMES_DATA_DIR:-/data/assistant}:/opt/data
      # Durable runtime state stays on HERMES_DATA_DIR
      - ./hermes/main/skills:/opt/data/skills:ro
      - ./hermes/main/plugins:/opt/data/plugins:ro
      - ./hermes/main/messages:/opt/data/messages:ro
      - ./hermes/main/SOUL.md:/opt/data/SOUL.md:ro
      - ./hermes/main/docker/hermes-replica-entry.sh:/opt/stack/hermes-replica-entry.sh:ro
      - ./config/agent/secret-probe.json:/opt/data/secret-probe.json:ro
    depends_on:
      - router-worker
      - memory
      - workflow
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [internal]

  # Optional — ENABLE_ZALO=active (run.sh --profile zalo). Host bridge :8787 into Docker.
  # Combo: zalo-proxy AND zalo-api must both run. Bridge-only is not a working Zalo channel.
  zalo-proxy:
    profiles: ["zalo"]
    image: ${SOCAT_IMAGE:-alpine/socat:1.8.0.3}
    restart: unless-stopped
    command: TCP-LISTEN:8787,fork,reuseaddr TCP:host.docker.internal:8787
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - zalo-api
    networks: [internal]

  # Zalo channel admin API (!zalo claim / allowlists). Required companion of zalo-proxy.
  zalo-api:
    profiles: ["zalo"]
    build: ./architect/zalo-api
    restart: unless-stopped
    environment:
      - ZALO_API_TOKEN=${ZALO_API_TOKEN:-}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-}
      - ZALO_ADMIN_USERS=${ZALO_ADMIN_USERS:-}
      - ZALO_ADMIN_USERS_FILE=/data/assistant/zalo_admin_users.txt
      - ZALO_ALLOWED_THREADS_FILE=/data/assistant/zalo_allowed_threads.txt
      - ZALO_DENIED_THREADS_FILE=/data/assistant/zalo_denied_threads.txt
      - ZALO_ALLOWED_USERS_FILE=/data/assistant/zalo_allowed_users.txt
      - ZALO_USERS_MODE_FILE=/data/assistant/zalo_users_mode.txt
      - DATABASE_URL=postgresql://${MEMORY_DB_USER:-hermes}:${MEMORY_DB_PASSWORD}@postgres:5432/${MEMORY_DB_NAME:-hermes_memory}
      - ZALO_BRIDGE_URL=${ZALO_BRIDGE_URL:-http://host.docker.internal:8787}
      - ZALO_PLUGIN_TOKEN=${ZALO_PLUGIN_TOKEN:-}
      - AUTHZ_URL=${AUTHZ_URL:-http://authz:8097}
      - NOTIFY_URL=${NOTIFY_URL:-http://notify:8092}
      - NOTIFY_ON_APPROVE=${NOTIFY_ON_APPROVE:-0}
      - SESSION_URL=${SESSION_URL:-http://session:8107}
      - INGEST_URL=${INGEST_URL:-http://ingest:8099}
      - HERMES_DATA_DIR=/data/assistant
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - HERMES_CONTAINER=${HERMES_CONTAINER:-hermes}
      - WORKFLOW_URL=${WORKFLOW_URL:-http://workflow:8108}
      - SCHEDULE_URL=${SCHEDULE_URL:-http://schedule-worker:8110}
      - CHANNELS_REGISTRY_FILE=/data/assistant/channels/registry.json
      - ZALO_ADMIN_MESSAGES=/app/zalo-admin.json
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ${ASSISTANT_DATA_DIR:-/data/assistant}:/data/assistant
      - ./hermes/main/messages/zalo-admin.json:/app/zalo-admin.json:ro
      # No docker.sock — host timers (stack-watch / zalo-watch) restart Hermes.
    ports:
      - "127.0.0.1:${ZALO_API_PORT:-8100}:8100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      workflow:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks: [internal]
