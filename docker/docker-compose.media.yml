# assistant — Media|File Worker overlay (dispatcher, OCR, Jobs, SearXNG, ComfyUI CPU).
# Merged when WORKER_MEDIA_FILE=active (or ENABLE_MEDIA_FILE / ENABLE_OCR / ENABLE_JOBS / ENABLE_SEARXNG is 1).
#
# Worker bundled defaults (when active): ENABLE_OCR=1 ENABLE_JOBS=1 OFFICE_FILE_GEN=1
# IMAGE_BACKENDS=llm,vendor,comfy-cpu,comfy-gpu
# File-gen lives in dispatcher (office_file.py). Web backends: vendors first, SearXNG last.
#
# Do NOT re-list hermes/dispatcher environment here — Compose list-merge would
# replace the base env and drop core keys.
#
# No container_name on media services — installed via `bash run.sh install media`.
# Compose assigns project-scoped names (e.g. assistant-searxng-1). Internal DNS still
# uses service names (searxng, ocr, …). run.sh removes legacy fixed-name orphans on up.

services:
  searxng:
    image: ${SEARXNG_IMAGE:-searxng/searxng:latest}
    restart: unless-stopped
    volumes:
      - ./config/searxng:/etc/searxng:ro
    environment:
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-http://searxng:8080/}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"
    networks: [internal]

  ocr:
    build:
      context: ./architect/tools/ocr
      args:
        INSTALL_PADDLE: ${INSTALL_PADDLE:-1}
    restart: unless-stopped
    environment:
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://omni-router:20129/v1}
      - OPENAI_API_KEY=${OMNIROUTER_API_KEY:-${N9ROUTER_API_KEY:-}}
      - OCR_MODEL=${OCR_MODEL:-hermes}
      - OCR_MEDIA_ROOT=/data/media
      - OCR_FALLBACK=${OCR_FALLBACK:-1}
      - OCR_PADDLE=${OCR_PADDLE:-1}
      - OCR_VISION=${OCR_VISION:-0}
      - OCR_PADDLE_MOBILE=${OCR_PADDLE_MOBILE:-1}
      - OCR_PADDLE_TIMEOUT_S=${OCR_PADDLE_TIMEOUT_S:-90}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ${ASSISTANT_DATA_DIR:-/data/assistant}/media:/data/media
      - ${ASSISTANT_DATA_DIR:-/data/assistant}/media/.cache/paddleocr:/tmp/.paddlex
    ports:
      - "127.0.0.1:${OCR_PORT:-8091}:8091"
    networks: [internal]
    mem_limit: ${OCR_MEM_LIMIT:-3g}

  jobs:
    build: ./architect/tools/jobs
    restart: unless-stopped
    environment:
      - VALKEY_URL=${VALKEY_URL:-valkey://valkey:6379/0}
      - REDIS_URL=${VALKEY_URL:-${REDIS_URL:-redis://valkey:6379/0}}
      - RQ_QUEUES=${RQ_QUEUES:-default,ingest,memory,learn,security}
      - INGEST_URL=${INGEST_URL:-http://ingest:8099}
      - MEMORY_URL=${MEMORY_URL:-http://memory:8095}
      - OCR_URL=${OCR_URL:-http://ocr:8091}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    depends_on:
      valkey:
        condition: service_healthy
    ports:
      - "127.0.0.1:${JOBS_PORT:-8104}:8104"
    networks: [internal]

  jobs-worker:
    build: ./architect/tools/jobs
    restart: unless-stopped
    command: ["python", "worker.py"]
    environment:
      - VALKEY_URL=${VALKEY_URL:-valkey://valkey:6379/0}
      - REDIS_URL=${VALKEY_URL:-${REDIS_URL:-redis://valkey:6379/0}}
      - RQ_QUEUES=${RQ_QUEUES:-default,ingest,memory,learn,security}
      - INGEST_URL=${INGEST_URL:-http://ingest:8099}
      - MEMORY_URL=${MEMORY_URL:-http://memory:8095}
      - OCR_URL=${OCR_URL:-http://ocr:8091}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    depends_on:
      valkey:
        condition: service_healthy
      jobs:
        condition: service_started
    networks: [internal]

  # Default self-host image gen (no VGA): SDXL / SD 1.5 via ComfyUI CPU
  comfyui-cpu:
    image: ${COMFYUI_CPU_IMAGE:-yanwk/comfyui-boot:cpu}
    restart: unless-stopped
    environment:
      # --cpu required: cpu image still ships torch without CUDA; without it main.py asserts
      - CLI_ARGS=--listen 0.0.0.0 --port 8188 --cpu
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ${ASSISTANT_DATA_DIR:-/data/assistant}/comfyui:/root
    ports:
      - "127.0.0.1:${COMFYUI_CPU_PORT:-8188}:8188"
    networks: [internal]

  # Optional GPU path: FLUX.2 [klein] 4B — enable with COMFYUI_HAS_GPU=1 (compose profile comfy-gpu)
  comfyui-gpu:
    profiles: ["comfy-gpu"]
    image: ${COMFYUI_GPU_IMAGE:-yanwk/comfyui-boot:cu124}
    restart: unless-stopped
    environment:
      - CLI_ARGS=--listen 0.0.0.0 --port 8188
      - NVIDIA_VISIBLE_DEVICES=all
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ${ASSISTANT_DATA_DIR:-/data/assistant}/comfyui-gpu:/root
    ports:
      - "127.0.0.1:${COMFYUI_GPU_PORT:-8189}:8188"
    networks: [internal]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  dispatcher:
    depends_on:
      - searxng
      - comfyui-cpu

  hermes:
    depends_on:
      - ocr
      - jobs

  ingest:
    depends_on:
      - ocr
