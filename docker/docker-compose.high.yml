# assistant — High profile overlay (merged after medium when ASSISTANT_PROFILE=high)
# Adds: OpenBao (+ UI), security, SIEM, authz, policy, admin-api, monitor, optional CloudDrive.
# Notify OFF by default — compose profile "notify" when ENABLE_NOTIFY=1.
# ClamAV / av-gateway OFF by default — compose profile "antivirus" when ENABLE_ANTIVIRUS=1.
#
# Do NOT re-list Must/Medium environment lists here (Compose list-merge replaces).

volumes:
  clamav_data:
  loki_data:
  alloy_data:
  prometheus_data:
  grafana_data:

services:
  openbao:
    image: ${OPENBAO_IMAGE:-openbao/openbao:2.2.0}
    container_name: openbao
    restart: unless-stopped
    cap_add: ["IPC_LOCK"]
    environment:
      - BAO_DEV_ROOT_TOKEN_ID=${OPENBAO_DEV_ROOT_TOKEN:-CHANGE_ME_OPENBAO}
      - BAO_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - BAO_ADDR=http://127.0.0.1:8200
      - VAULT_UI=true
      - BAO_UI=true
    # -dev already binds :8200 — do NOT also pass -config with a listener (bind conflict)
    command:
      - server
      - -dev
      - -dev-root-token-id=${OPENBAO_DEV_ROOT_TOKEN:-CHANGE_ME_OPENBAO}
      - -dev-listen-address=0.0.0.0:8200
    ports:
      - "127.0.0.1:${OPENBAO_PORT:-8200}:8200"
    networks: [internal]

  # Optional — only when run.sh passes --profile antivirus (ENABLE_ANTIVIRUS=1)
  clamav:
    profiles: ["antivirus"]
    image: ${CLAMAV_IMAGE:-clamav/clamav:1.4}
    container_name: clamav
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    ports:
      - "127.0.0.1:${CLAMAV_PORT:-3310}:3310"
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 2 127.0.0.1 3310 | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s
    networks: [internal]

  av-gateway:
    profiles: ["antivirus"]
    build: ./architect/security/av-gateway
    container_name: av-gateway
    restart: unless-stopped
    environment:
      - CLAMAV_HOST=${CLAMAV_HOST:-clamav}
      - CLAMAV_PORT=3310
      - AV_QUEUE_WORKERS=${AV_QUEUE_WORKERS:-2}
      - AV_SCAN_TIMEOUT_SECONDS=${AV_SCAN_TIMEOUT_SECONDS:-120}
      - AV_QUARANTINE_DIR=/data/quarantine
      - AV_QUARANTINE_DAYS=${AV_QUARANTINE_DAYS:-7}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ${ASSISTANT_DATA_DIR:-/data/assistant}/quarantine:/data/quarantine
    ports:
      - "127.0.0.1:${AV_GATEWAY_PORT:-8098}:8098"
    depends_on:
      - clamav
    networks: [internal]

  security-manager:
    build: ./architect/security/security-manager
    container_name: security-manager
    restart: unless-stopped
    environment:
      # Empty / unreachable when ENABLE_ANTIVIRUS=0 — security still runs (LLM/YARA paths)
      - AV_GATEWAY_URL=${AV_GATEWAY_URL:-http://av-gateway:8098}
      - LLM_JUDGE_URL=${LLM_JUDGE_URL:-http://9router:20128/v1}
      - LLM_JUDGE_KEY=${LLM_JUDGE_KEY:-${N9ROUTER_API_KEY:-}}
      - OPENAI_BASE_URL=${LLM_JUDGE_URL:-http://9router:20128/v1}
      - OPENAI_API_KEY=${N9ROUTER_API_KEY:-}
      - SECURITY_LLM_JUDGE=${SECURITY_LLM_JUDGE:-1}
      - ENABLE_LLM_JUDGE=${ENABLE_LLM_JUDGE:-1}
      - SECURITY_YARA=${SECURITY_YARA:-1}
      - SECURITY_SANDBOX=${SECURITY_SANDBOX:-0}
      - QUARANTINE_DIR=/data/quarantine
      - NOTIFY_URL=${NOTIFY_URL:-http://notify:8092}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ${ASSISTANT_DATA_DIR:-/data/assistant}/quarantine:/data/quarantine
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:${SECURITY_PORT:-8093}:8093"
    depends_on:
      - 9router
    networks: [internal]

  siem:
    build: ./architect/security/siem
    container_name: siem
    restart: unless-stopped
    environment:
      - LOKI_URL=${LOKI_URL:-http://loki:3100}
      - LISTEN=0.0.0.0:8105
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "127.0.0.1:${SIEM_PORT:-8105}:8105"
    networks: [internal]

  authz:
    build: ./architect/authentication/authz
    container_name: authz
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${MEMORY_DB_USER:-hermes}:${MEMORY_DB_PASSWORD}@postgres:5432/${MEMORY_DB_NAME:-hermes_memory}
      - ZALO_ALLOWED_THREADS=${ZALO_ALLOWED_THREADS:-}
      - ZALO_HOME_CHANNEL=${ZALO_HOME_CHANNEL:-}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "127.0.0.1:${AUTHZ_PORT:-8097}:8097"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  policy-center:
    build: ./architect/authentication/policy-center
    container_name: policy-center
    restart: unless-stopped
    environment:
      - POLICY_STORE=/data/policies.json
      - SIEM_URL=${SIEM_URL:-http://siem:8105}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ${ASSISTANT_DATA_DIR:-/data/assistant}/policy-center:/data
    ports:
      - "127.0.0.1:${POLICY_PORT:-8106}:8106"
    networks: [internal]

  admin-api:
    build: ./architect/admin-api
    container_name: admin-api
    restart: unless-stopped
    environment:
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-}
      - ZALO_ADMIN_USERS=${ZALO_ADMIN_USERS:-}
      - ZALO_ADMIN_USERS_FILE=/data/assistant/zalo_admin_users.txt
      - ZALO_ALLOWED_THREADS_FILE=/data/assistant/zalo_allowed_threads.txt
      - ZALO_DENIED_THREADS_FILE=/data/assistant/zalo_denied_threads.txt
      - ZALO_ALLOWED_USERS_FILE=/data/assistant/zalo_allowed_users.txt
      - ZALO_USERS_MODE_FILE=/data/assistant/zalo_users_mode.txt
      - ZALO_BRIDGE_URL=${ZALO_BRIDGE_URL:-http://host.docker.internal:8787}
      - ZALO_PLUGIN_TOKEN=${ZALO_PLUGIN_TOKEN:-}
      - AUTHZ_URL=${AUTHZ_URL:-http://authz:8097}
      - NOTIFY_URL=${NOTIFY_URL:-http://notify:8092}
      - NOTIFY_ON_APPROVE=${NOTIFY_ON_APPROVE:-0}
      - SESSION_URL=${SESSION_URL:-http://session:8107}
      - INGEST_URL=${INGEST_URL:-http://ingest:8099}
      - HERMES_DATA_DIR=/data/assistant
      - HERMES_CONTAINER=${HERMES_CONTAINER:-hermes}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ${ASSISTANT_DATA_DIR:-/data/assistant}:/data/assistant
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:${ADMIN_API_PORT:-8100}:8100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - authz
    networks: [internal]

  loki:
    profiles: ["monitor"]
    image: ${LOKI_IMAGE:-grafana/loki:3.4.2}
    container_name: loki
    restart: unless-stopped
    user: "0:0"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./config/monitor/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks: [internal]

  alloy:
    profiles: ["monitor"]
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.9.1}
    container_name: alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./config/monitor/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    networks: [internal]

  prometheus:
    profiles: ["monitor"]
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.2.1}
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./config/monitor/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [internal]

  grafana:
    profiles: ["monitor"]
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.6.0}
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-23000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme-set-in-env}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://127.0.0.1:23000}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_DISABLE_LOGIN_FORM=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/monitor/grafana:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    networks: [internal]

  nine-exporter:
    profiles: ["monitor"]
    build: ./architect/monitor/nine-exporter
    container_name: nine-exporter
    restart: unless-stopped
    environment:
      - LISTEN=0.0.0.0:9101
      - N9ROUTER_URL=http://9router:20128
      - N9ROUTER_PASSWORD=${N9ROUTER_INITIAL_PASSWORD:-}
      - SCRAPE_INTERVAL=30
    networks: [internal]

  stack-exporter:
    profiles: ["monitor"]
    build: ./architect/monitor/stack-exporter
    container_name: stack-exporter
    restart: unless-stopped
    environment:
      - LISTEN=0.0.0.0:9102
      - SCRAPE_INTERVAL=30
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_COLLECTION_KNOWLEDGE=${QDRANT_COLLECTION_KNOWLEDGE:-knowledge_chunks}
      - QDRANT_COLLECTION_MEMORY=${QDRANT_COLLECTION_MEMORY:-conversational_memory}
      - HEALTH_TARGETS=${STACK_HEALTH_TARGETS:-qdrant=qdrant:6333/readyz,security-manager=security-manager:8093/health,ocr=ocr:8091/health,ingest=ingest:8099/health,authz=authz:8097/health,embedding=embedding:8094/health,dispatcher=dispatcher:8090/health,memory=memory:8095/health,admin-api=admin-api:8100/health,openbao=openbao:8200/v1/sys/health}
    networks: [internal]

  # Optional — only when run.sh passes --profile notify (ENABLE_NOTIFY=1)
  notify:
    profiles: ["notify"]
    build: ./architect/notification/notify
    container_name: notify
    restart: unless-stopped
    environment:
      - ZALO_BRIDGE_URL=${ZALO_BRIDGE_URL:-http://host.docker.internal:8787}
      - ZALO_PLUGIN_TOKEN=${ZALO_PLUGIN_TOKEN:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - NOTIFY_ZALO_THREAD=${NOTIFY_ZALO_THREAD:-}
      - NOTIFY_ZALO_THREAD_TYPE=${NOTIFY_ZALO_THREAD_TYPE:-user}
      - NOTIFY_TELEGRAM_CHAT=${NOTIFY_TELEGRAM_CHAT:-}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "127.0.0.1:${NOTIFY_PORT:-8092}:8092"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [internal]

  alert-watch:
    profiles: ["notify"]
    build: ./architect/monitor/alert-watch
    container_name: alert-watch
    restart: unless-stopped
    environment:
      - LISTEN=0.0.0.0:9103
      - CHECK_INTERVAL=${ALERT_CHECK_INTERVAL:-60}
      - ALERT_COOLDOWN_SECONDS=${ALERT_COOLDOWN_SECONDS:-1800}
      - NOTIFY_URL=${NOTIFY_URL:-http://notify:8092}
      - N9ROUTER_URL=${N9ROUTER_URL:-http://9router:20128}
      - N9ROUTER_PASSWORD=${N9ROUTER_INITIAL_PASSWORD:-}
      - N9ROUTER_API_KEY=${N9ROUTER_API_KEY:-}
      - HEALTH_TARGETS=${ALERT_HEALTH_TARGETS:-qdrant=qdrant:6333/readyz,ocr=ocr:8091/health,ingest=ingest:8099/health,dispatcher=dispatcher:8090/health,memory=memory:8095/health,openbao=openbao:8200/v1/sys/health}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "127.0.0.1:${ALERT_WATCH_PORT:-9103}:9103"
    depends_on:
      - notify
    networks: [internal]

  # Optional — ENABLE_CLOUDDRIVE=1 + rclone config on host
  clouddrive-sync:
    profiles: ["clouddrive"]
    image: ${RCLONE_IMAGE:-rclone/rclone:1.69}
    container_name: clouddrive-sync
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          rclone sync "${CLOUDDRIVE_REMOTE}${CLOUDDRIVE_DOCS_PATH}" /data/clouddrive --exclude ".git/**" || true
          sleep "${CLOUDDRIVE_SYNC_SECONDS:-900}"
        done
    environment:
      - CLOUDDRIVE_REMOTE=${CLOUDDRIVE_REMOTE:-clouddrive:}
      - CLOUDDRIVE_DOCS_PATH=${CLOUDDRIVE_DOCS_PATH:-assistant/docs}
      - CLOUDDRIVE_SYNC_SECONDS=${CLOUDDRIVE_SYNC_SECONDS:-900}
    volumes:
      - ${RCLONE_CONFIG_DIR:-/root/.config/rclone}:/config/rclone:ro
      - ${CLOUDDRIVE_MIRROR_DIR:-/data/clouddrive}:/data/clouddrive
    networks: [internal]

  hermes:
    depends_on:
      - openbao
      - authz
      - admin-api

  ingest:
    depends_on:
      - security-manager
