global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: nine-exporter
    static_configs:
      - targets: ["nine-exporter:9101"]

  - job_name: stack-exporter
    static_configs:
      - targets: ["stack-exporter:9102"]

  - job_name: openbao
    metrics_path: /v1/sys/metrics
    params:
      format: ["prometheus"]
    static_configs:
      - targets: ["openbao:8200"]
