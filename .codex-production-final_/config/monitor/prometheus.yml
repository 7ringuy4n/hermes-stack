global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: omni-exporter
    static_configs:
      - targets: ["omni-exporter:9104"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: stack-exporter
    static_configs:
      - targets: ["stack-exporter:9102"]

  - job_name: openbao
    metrics_path: /v1/sys/metrics
    params:
      format: ["prometheus"]
    static_configs:
      - targets: ["openbao:8200"]
